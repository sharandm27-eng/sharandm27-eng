
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="64" viewBox="0 0 800 64"
     shape-rendering="crispEdges">

  <rect width="800" height="64" fill="#0d0221"/>

  <!-- Top border -->
  <rect x="20" y="5" width="760" height="3" fill="#ff2e97"/>

  <!-- Pixel stars -->
  <g fill="#ffe600">

    <g>
      <rect x="45" y="20" width="8" height="8"/>
      <rect x="37" y="24" width="24" height="4"/>
      <rect x="45" y="28" width="8" height="8"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;0 -7;0 0"
        dur="2.5s" repeatCount="indefinite"/>
    </g>

    <g>
      <rect x="735" y="18" width="8" height="8"/>
      <rect x="727" y="22" width="24" height="4"/>
      <rect x="735" y="26" width="8" height="8"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;0 -6;0 0"
        dur="3s" repeatCount="indefinite"/>
    </g>

    <rect x="120" y="19" width="6" height="6">
      <animate attributeName="opacity"
        values="1;0.2;1" dur="1.5s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="675" y="36" width="6" height="6">
      <animate attributeName="opacity"
        values="1;0.2;1" dur="2s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="250" y="38" width="6" height="6"/>
    <rect x="540" y="16" width="6" height="6"/>

  </g>

  <!-- Pixel hearts -->
  <g fill="#ff2e97">

    <g>
      <rect x="155" y="24" width="8" height="8"/>
      <rect x="171" y="24" width="8" height="8"/>
      <rect x="147" y="32" width="40" height="8"/>
      <rect x="155" y="40" width="24" height="8"/>
      <rect x="163" y="48" width="8" height="4"/>

      <animateTransform attributeName="transform"
        type="translate" values="0 0;0 -8;0 0"
        dur="3s" repeatCount="indefinite"/>
    </g>

    <g>
      <rect x="620" y="24" width="8" height="8"/>
      <rect x="636" y="24" width="8" height="8"/>
      <rect x="612" y="32" width="40" height="8"/>
      <rect x="620" y="40" width="24" height="8"/>
      <rect x="628" y="48" width="8" height="4"/>

      <animateTransform attributeName="transform"
        type="translate" values="0 0;0 -8;0 0"
        dur="3.5s" repeatCount="indefinite"/>
    </g>

  </g>

  <!-- Cyan floating pixels -->
  <g fill="#00f0ff">
    <rect x="220" y="19" width="6" height="6">
      <animate attributeName="opacity"
        values="1;0;1" dur="1.8s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="580" y="39" width="6" height="6">
      <animate attributeName="opacity"
        values="1;0;1" dur="2.2s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="300" y="25" width="6" height="6"/>
    <rect x="500" y="30" width="6" height="6"/>
  </g>

  <!-- Main arcade message -->
  <text x="400" y="37"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="20"
        font-weight="bold"
        fill="#39ff14">

    GAME OVER? NO. CONTINUE? YES

    <animate attributeName="opacity"
      values="1;0.2;1"
      dur="1.2s"
      repeatCount="indefinite"/>
  </text>

  <!-- Bottom border -->
  <rect x="20" y="56" width="760" height="3" fill="#00f0ff"/>

</svg>
