
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="260" viewBox="0 0 800 260"
     shape-rendering="crispEdges">

  <rect width="800" height="260" fill="#0d0221"/>

  <!-- Arcade cabinet shadow -->
  <rect x="42" y="25" width="218" height="218" fill="#1a0b3b"/>
  <rect x="50" y="17" width="202" height="218" fill="#ff2e97"/>
  <rect x="58" y="25" width="186" height="202" fill="#1a0b3b"/>

  <!-- Cabinet top -->
  <rect x="74" y="33" width="154" height="12" fill="#ffe600"/>
  <rect x="82" y="45" width="138" height="8" fill="#00f0ff"/>

  <!-- Screen frame -->
  <rect x="74" y="61" width="154" height="103" fill="#00f0ff"/>
  <rect x="82" y="69" width="138" height="87" fill="#0d0221"/>
  <rect x="90" y="77" width="122" height="71" fill="#1a0b3b"/>

  <!-- Screen pixel details -->
  <rect x="98" y="85" width="16" height="4" fill="#ff2e97"/>
  <rect x="186" y="85" width="16" height="4" fill="#39ff14"/>
  <rect x="102" y="119" width="12" height="4" fill="#00f0ff"/>
  <rect x="186" y="119" width="12" height="4" fill="#00f0ff"/>

  <text x="151" y="105"
        fill="#ffe600"
        font-family="'Press Start 2P','Courier New',monospace"
        font-size="13" font-weight="bold"
        text-anchor="middle">INSERT</text>

  <text x="151" y="125"
        fill="#ffe600"
        font-family="'Press Start 2P','Courier New',monospace"
        font-size="13" font-weight="bold"
        text-anchor="middle">COIN</text>

  <rect x="145" y="133" width="12" height="4" fill="#39ff14">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.2s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Cabinet controls -->
  <rect x="82" y="174" width="138" height="33" fill="#0d0221"/>
  <rect x="98" y="185" width="16" height="16" fill="#ff2e97"/>
  <rect x="102" y="189" width="8" height="8" fill="#ffe600"/>
  <rect x="145" y="183" width="12" height="12" fill="#00f0ff"/>
  <rect x="169" y="183" width="12" height="12" fill="#39ff14"/>
  <rect x="86" y="215" width="130" height="8" fill="#ffe600"/>

  <!-- Cabinet feet -->
  <rect x="82" y="235" width="32" height="12" fill="#ff2e97"/>
  <rect x="190" y="235" width="32" height="12" fill="#ff2e97"/>

  <!-- Main title -->
  <text x="295" y="106"
        font-family="'Press Start 2P','Courier New',monospace"
        font-size="65" font-weight="bold"
        fill="#ff2e97">SHARAN
    <animate attributeName="fill"
             values="#ff2e97;#00f0ff;#ff2e97"
             dur="1.6s"
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <rect x="298" y="127" width="390" height="4" fill="#00f0ff"/>
  <text x="300" y="160"
        font-family="'Courier New',monospace"
        font-size="25" font-weight="bold"
        fill="#f5f5f5">AI / ML PLAYER 1</text>

  <text x="300" y="193"
        font-family="'Courier New',monospace"
        font-size="15" font-weight="bold"
        fill="#39ff14">PRESS START TO EXPLORE</text>

  <text x="300" y="222"
        font-family="'Courier New',monospace"
        font-size="12" font-weight="bold"
        fill="#ffe600">LEVEL 02  |  BENGALURU, INDIA</text>

  <!-- Floating pixel stars -->
  <g fill="#ffe600">
    <rect x="285" y="20" width="6" height="6"/>
    <rect x="281" y="24" width="14" height="4"/>
    <rect x="285" y="28" width="6" height="6"/>
    <rect x="285" y="20" width="6" height="6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -12;0 0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="22" width="6" height="6">
      <animate attributeName="opacity" values="1;0.2;1"
        dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="720" y="80" width="6" height="6"/>
    <rect x="716" y="84" width="14" height="4"/>
    <rect x="720" y="88" width="6" height="6"/>
    <rect x="570" y="225" width="6" height="6"/>
    <rect x="566" y="229" width="14" height="4"/>
    <rect x="570" y="233" width="6" height="6"/>
  </g>

  <!-- Floating cyan pixels -->
  <g fill="#00f0ff">
    <rect x="390" y="32" width="6" height="6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -14;0 0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="665" y="25" width="6" height="6">
      <animate attributeName="opacity" values="1;0.1;1"
        dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="750" y="145" width="6" height="6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="218" width="6" height="6"/>
  </g>

  <!-- Pixel hearts -->
  <g fill="#ff2e97">
    <rect x="690" y="185" width="6" height="6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -14;0 0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="686" y="181" width="6" height="6"/>
    <rect x="694" y="181" width="6" height="6"/>
    <rect x="686" y="189" width="14" height="6"/>
    <rect x="690" y="195" width="6" height="6"/>

    <rect x="455" y="200" width="6" height="6">
      <animate attributeName="opacity" values="1;0.2;1"
        dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Extra stars -->
  <g fill="#39ff14">
    <rect x="315" y="45" width="6" height="6">
      <animate attributeName="opacity" values="1;0;1"
        dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="535" y="65" width="6" height="6"/>
    <rect x="610" y="210" width="6" height="6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -12;0 0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pixel floor -->
  <rect x="275" y="246" width="490" height="4" fill="#ff2e97"/>
  <rect x="275" y="252" width="490" height="4" fill="#00f0ff"/>

</svg>
