
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="310" viewBox="0 0 800 310"
     shape-rendering="crispEdges">

  <rect width="800" height="310" fill="#0d0221"/>

  <!-- Header -->
  <text x="400" y="34" text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="23" font-weight="bold"
        fill="#ffe600">PLAYER 1 // QUEST LOG</text>

  <rect x="25" y="47" width="750" height="3" fill="#ff2e97"/>

  <!-- Featured Quest Card -->
  <g>
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;0 -2;0 0"
      dur="3s" repeatCount="indefinite"/>

    <rect x="180" y="62" width="440" height="210" fill="#ffe600"/>
    <rect x="188" y="70" width="424" height="194" fill="#39ff14"/>
    <rect x="196" y="78" width="408" height="178" fill="#1a0b3b"/>

    <!-- Cartridge header -->
    <rect x="210" y="87" width="380" height="25" fill="#0d0221"/>

    <text x="400" y="105" text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="14" font-weight="bold"
          fill="#39ff14">FEATURED QUEST // 001</text>

    <!-- Pixel agricultural icon -->
    <g>
      <!-- Sun -->
      <rect x="386" y="119" width="28" height="8" fill="#ffe600"/>
      <rect x="378" y="127" width="44" height="8" fill="#ffe600"/>
      <rect x="386" y="135" width="28" height="8" fill="#ffe600"/>

      <!-- Farm field -->
      <rect x="340" y="145" width="120" height="8" fill="#39ff14"/>
      <rect x="348" y="153" width="104" height="8" fill="#39ff14"/>
      <rect x="356" y="161" width="88" height="8" fill="#39ff14"/>

      <!-- Crop plants -->
      <rect x="366" y="137" width="8" height="16" fill="#00f0ff"/>
      <rect x="354" y="137" width="12" height="8" fill="#39ff14"/>
      <rect x="374" y="133" width="12" height="8" fill="#39ff14"/>

      <rect x="396" y="137" width="8" height="16" fill="#00f0ff"/>
      <rect x="384" y="137" width="12" height="8" fill="#39ff14"/>
      <rect x="404" y="133" width="12" height="8" fill="#39ff14"/>

      <rect x="426" y="137" width="8" height="16" fill="#00f0ff"/>
      <rect x="414" y="137" width="12" height="8" fill="#39ff14"/>
      <rect x="434" y="133" width="12" height="8" fill="#39ff14"/>

      <!-- Ground -->
      <rect x="332" y="169" width="136" height="8" fill="#ffe600"/>
    </g>

    <!-- Project name -->
    <text x="400" y="203" text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="26" font-weight="bold"
          fill="#39ff14">VYAPTI KSHETRA</text>

    <!-- Description -->
    <text x="400" y="221" text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="12" fill="#f5f5f5">AI-POWERED AGRICULTURAL MARKETPLACE</text>

    <text x="400" y="236" text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="11" fill="#00f0ff">SMART INDIA HACKATHON 2026</text>

    <!-- Status -->
    <rect x="300" y="241" width="200" height="17" fill="#39ff14"/>
    <text x="400" y="253" text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="11" font-weight="bold"
          fill="#0d0221">IN PROGRESS</text>
  </g>

  <!-- Footer -->
  <rect x="25" y="286" width="750" height="3" fill="#00f0ff"/>

  <text x="400" y="305" text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="12" font-weight="bold"
        fill="#ffe600">1 FEATURED QUEST // MORE MISSIONS LOADING...</text>

</svg>
