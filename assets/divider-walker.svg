
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="64" viewBox="0 0 800 64"
     shape-rendering="crispEdges">

  <rect width="800" height="64" fill="#0d0221"/>

  <!-- Ground tiles -->
  <g>
    <rect x="0" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="32" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="64" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="96" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="128" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="160" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="192" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="224" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="256" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="288" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="320" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="352" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="384" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="416" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="448" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="480" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="512" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="544" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="576" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="608" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="640" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="672" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="704" y="48" width="32" height="16" fill="#ff2e97"/>
    <rect x="736" y="48" width="32" height="16" fill="#00f0ff"/>
    <rect x="768" y="48" width="32" height="16" fill="#ff2e97"/>
  </g>

  <!-- Ground highlight -->
  <rect x="0" y="46" width="800" height="3" fill="#ffe600"/>

  <!-- Coin 1 -->
  <g>
    <rect x="174" y="24" width="12" height="16" fill="#ffe600"/>
    <rect x="178" y="20" width="4" height="24" fill="#ffe600"/>
    <rect x="178" y="28" width="4" height="8" fill="#0d0221"/>
    <animate attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.21;0.23;1"
      dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Coin 2 -->
  <g>
    <rect x="390" y="24" width="12" height="16" fill="#ffe600"/>
    <rect x="394" y="20" width="4" height="24" fill="#ffe600"/>
    <rect x="394" y="28" width="4" height="8" fill="#0d0221"/>
    <animate attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.49;0.51;1"
      dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Coin 3 -->
  <g>
    <rect x="614" y="24" width="12" height="16" fill="#ffe600"/>
    <rect x="618" y="20" width="4" height="24" fill="#ffe600"/>
    <rect x="618" y="28" width="4" height="8" fill="#0d0221"/>
    <animate attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.79;0.81;1"
      dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Score popups -->
  <g font-family="Courier New, monospace"
     font-size="13" font-weight="bold"
     fill="#39ff14">

    <text x="170" y="19" opacity="0">+1
      <animate attributeName="opacity"
        values="0;1;0;0"
        keyTimes="0;0.22;0.27;1"
        dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 5;0 -12;0 -12"
        keyTimes="0;0.22;1"
        dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="386" y="19" opacity="0">+1
      <animate attributeName="opacity"
        values="0;1;0;0"
        keyTimes="0;0.50;0.55;1"
        dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 5;0 -12;0 -12"
        keyTimes="0;0.50;1"
        dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="610" y="19" opacity="0">+1
      <animate attributeName="opacity"
        values="0;1;0;0"
        keyTimes="0;0.80;0.85;1"
        dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 5;0 -12;0 -12"
        keyTimes="0;0.80;1"
        dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Walking robot -->
  <g>
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;740 0"
      dur="8s"
      repeatCount="indefinite"/>

    <!-- Walking frame 1 -->
    <g>
      <!-- Antenna -->
      <rect x="14" y="2" width="4" height="6" fill="#ffe600"/>
      <rect x="10" y="0" width="12" height="4" fill="#39ff14"/>

      <!-- Head -->
      <rect x="4" y="8" width="24" height="16" fill="#00f0ff"/>
      <rect x="8" y="12" width="4" height="4" fill="#0d0221"/>
      <rect x="20" y="12" width="4" height="4" fill="#0d0221"/>
      <rect x="12" y="20" width="8" height="2" fill="#ff2e97"/>

      <!-- Body -->
      <rect x="8" y="24" width="16" height="12" fill="#f5f5f5"/>
      <rect x="12" y="28" width="8" height="4" fill="#ff2e97"/>

      <!-- Arms -->
      <rect x="0" y="26" width="8" height="4" fill="#ffe600"/>
      <rect x="24" y="26" width="8" height="4" fill="#ffe600"/>

      <!-- Legs frame 1 -->
      <rect x="8" y="36" width="6" height="8" fill="#00f0ff"/>
      <rect x="18" y="36" width="6" height="4" fill="#00f0ff"/>
      <rect x="18" y="40" width="10" height="4" fill="#00f0ff"/>

      <animate attributeName="opacity"
        values="1;0"
        dur="0.4s"
        repeatCount="indefinite"
        calcMode="discrete"/>
    </g>

    <!-- Walking frame 2 -->
    <g opacity="0">
      <!-- Antenna -->
      <rect x="14" y="2" width="4" height="6" fill="#ffe600"/>
      <rect x="10" y="0" width="12" height="4" fill="#39ff14"/>

      <!-- Head -->
      <rect x="4" y="8" width="24" height="16" fill="#00f0ff"/>
      <rect x="8" y="12" width="4" height="4" fill="#0d0221"/>
      <rect x="20" y="12" width="4" height="4" fill="#0d0221"/>
      <rect x="12" y="20" width="8" height="2" fill="#ff2e97"/>

      <!-- Body -->
      <rect x="8" y="24" width="16" height="12" fill="#f5f5f5"/>
      <rect x="12" y="28" width="8" height="4" fill="#ff2e97"/>

      <!-- Arms -->
      <rect x="0" y="26" width="8" height="4" fill="#ffe600"/>
      <rect x="24" y="22" width="8" height="4" fill="#ffe600"/>

      <!-- Legs frame 2 -->
      <rect x="8" y="36" width="6" height="4" fill="#00f0ff"/>
      <rect x="4" y="40" width="10" height="4" fill="#00f0ff"/>
      <rect x="18" y="36" width="6" height="8" fill="#00f0ff"/>

      <animate attributeName="opacity"
        values="0;1"
        dur="0.4s"
        repeatCount="indefinite"
        calcMode="discrete"/>
    </g>
  </g>

</svg>
